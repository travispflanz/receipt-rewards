# CI: every push and pull request runs the parser/answer-policy tests and a full Worker build.
# Deploys are done by Cloudflare Workers Builds (connected to this repo): a push to main runs
# `npm test` again and then `npx wrangler deploy`. No Cloudflare secrets live in this repo.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the Worker (dry run)
        run: npx wrangler deploy --dry-run --outdir dist
